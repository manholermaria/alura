<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<style>
  header {
    background-color: #8B4513;
    color: #CD853F;
    text-align: center;
    max-width: 800px;
    margin: 0 auto;
    border: 5px solid #CD853F;
    padding: 16px;
  }

  main {
    background-color: #8B4513;
    color: #CD853F;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  img {
    width: 300px;
    height: 300px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .conteudo-texto {
    text-align: left;
  }

  .botoes-container {
    margin-top: 16px;
  }

  button {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>Minha página é sobre a raça de cachorro-𝑫𝑨𝑪𝑯𝑺𝑯𝑼𝑵𝑫</h1>
    <p>Aqui vou compartilhar curiosidades sobre a raça</p>
  </header>
  
  <main>
  <img src="Gemini_Generated_Image_9r5bw79r5bw79r5b.png" alt="Filhote de cachorro salsicha Dachshund marrom claro">
    
    <div class="conteudo-texto">
      <h2>Meu primeiro post</h2>
      <p> 𝒑𝒐𝒓: 𝑴𝒂𝒓𝒊𝒂 𝑳𝒂𝒖𝒓𝒂</p>
      <p>Boas-vindas ao meu blog,aqui vou compartilhar curiosidades sobre a raça dos salsichas.</p>
      
      <div class="botoes-container">
        <button type="button">❤️ <span>0</span></button>  
        <button type="button">⭐ <span>0</span></button>   
      </div>
    </div>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
      botao.addEventListener("click", function () {
        let spanTexto = botao.querySelector("span");
        let valorAtual = parseInt(spanTexto.textContent);

        spanTexto.textContent = valorAtual + 1;
      });
    });
  </script>
</body>
</html>
