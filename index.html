<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<style>
  header {
    background-color: #CD853F;
    color: #8B4513;
    text-align: center;
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
  }

  main {
    background-color: #8B4513;
    color: #CD853F;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 24px;
  }

  img {
    width: 300px;
    height: 300px;
    object-fit: cover;
    flex-shrink: 0;
  }

  .conteudo-texto {
    text-align: left;
  }

  .botoes-container {
    margin-top: 16px;
  }

  button {
    cursor: pointer;
    padding: 8px 12px;
    font-size: 16px;
  }
</style>
</head>
<body>
  <header>
    <h1>𝑴𝒊𝒏𝒉𝒂 𝒑𝒂́𝒈𝒊𝒏𝒂 𝒆́ 𝒔𝒐𝒃𝒓𝒆 𝒂 𝒓𝒂𝒄̧𝒂 𝒅𝒆 𝒄𝒂𝒄𝒉𝒐𝒓𝒓𝒐-𝑫𝑨𝑪𝑯𝑺𝑯𝑼𝑵𝑫</h1>
    <p>𝑨𝒒𝒖𝒊 𝒗𝒐𝒖 𝒄𝒐𝒎𝒑𝒂𝒓𝒕𝒊𝒍𝒉𝒂𝒓 𝒄𝒖𝒓𝒊𝒐𝒔𝒊𝒅𝒂𝒅𝒆𝒔 𝒔𝒐𝒃𝒓𝒆 𝒂 𝒓𝒂𝒄̧𝒂 𝒅𝒐𝒔 𝒔𝒂𝒍𝒔𝒊𝒄𝒉𝒂𝒔🐾.</p>
  </header>
  
  <main>
  <img src="dachshund_filhote.png" alt="Filhote de cachorro salsicha Dachshund marrom claro">
    
    <div class="conteudo-texto">
      <h2>𝒎𝒆𝒖 𝒑𝒓𝒊𝒎𝒆𝒊𝒓𝒐 𝒑𝒐𝒔𝒕</h2>
      <p> 𝒑𝒐𝒓: 𝑴𝒂𝒓𝒊𝒂 𝑳𝒂𝒖𝒓𝒂</p>
      <p>𝑩𝒐𝒂𝒔-𝒗𝒊𝒏𝒅𝒂𝒔 𝒂𝒐 𝒎𝒆𝒖 𝒏𝒐𝒗𝒐 𝒃𝒍𝒐𝒈! 𝑨𝒒𝒖𝒊 𝒊𝒓𝒆𝒊 𝒄𝒐𝒎𝒑𝒂𝒓𝒕𝒊𝒍𝒉𝒂𝒓 𝒄𝒖𝒓𝒊𝒐𝒔𝒊𝒅𝒂𝒅𝒆𝒔 𝒔𝒐𝒃𝒓𝒆 𝒂 𝒓𝒂𝒄̧𝒂.</p>
      
      <div class="botoes-container">
        <button type="button">❤️ <span>0</span></button>  
        <button type="button">⭐ <span>0</span></button>   
      </div>
    </div>
  </main>

  <script>
    const botoes = document.querySelectorAll("button");

    botoes.forEach(function (botao) {
      botao.addEventListener("click", function () {
        let spanTexto = botao.querySelector("span");
        let valorAtual = parseInt(spanTexto.textContent);

        // Soma +1 a cada clique sem restrições
        spanTexto.textContent = valorAtual + 1;
      });
    });
  </script>
</body>
</html>
